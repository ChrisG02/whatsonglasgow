name: Update Glasgow digest

on:
  schedule:
    - cron: "0 7 * * *"    # every day at 07:00 UTC (7am GMT / 8am BST)
  workflow_dispatch:        # "Run workflow" button for updating on demand
  push:
    branches: [main]
    paths: [config.yaml, render.py, sources.py, main.py]   # rebuild when you change these

permissions:
  contents: write           # save state/items.json back to the repo
  pages: write              # publish the page
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch sources and build page
        run: python main.py
      - name: Remember what was found
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add state/items.json
          git diff --cached --quiet || git commit -m "Update found items"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
